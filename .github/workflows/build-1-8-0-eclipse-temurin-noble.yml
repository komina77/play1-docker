name: Build & Publish 1.8.0-eclipse-temurin-noble

on:
  push:
    branches: [ main ]
    paths:
      - '1.8.0/eclipse-temurin-noble/**'
      - '.github/workflows/build-1-8-0-eclipse-temurin-noble.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: komina77/play

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push 1.8.0-noble
        uses: docker/build-push-action@v6
        with:
          context: 1.8.0
          file: 1.8.0/eclipse-temurin-noble/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:1.8.0-noble
          cache-from: type=gha
          cache-to: type=gha,mode=max
