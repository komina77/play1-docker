name: Build & Publish 1.5.3-bullseye

on:
  push:
    branches: [ main ]
    paths:
      - '1.5.3/bullseye/**'
      - '.github/workflows/build-1-5-3-bullseye.yml'

env:
  IMAGE_NAME: komina77/play

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push 1.5.3-bullseye
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 1.5.3/bullseye/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:1.5.3-bullseye
